<div class="fixed top-0 w-full bg-gray-800 text-white flex justify-between items-center p-2 shadow-slate-900 shadow">

    <h1 class="text-2xl italic">
        ATHENAEUM's LIBRARY MANAGEMENT SYSTEM
    </h1>

    <div class="ml-190">
        <button class="bg-blue-800 hover:scale-105 text-white py-2 px-4 rounded" (click)="toggleDarkMode()">DARK MODE</button>
        <button class="bg-gray-500 hover:scale-105 text-white py-2 px-4 ml-5 rounded" (click)="toggleLightMode()">LIGHT MODE</button>
    </div>

    <img src="logo.avif" alt="Logo" class="w-12 h-12">
    
</div>


<div class="flex mt-16">

  @if(service.checkLogIn())
 {
    <aside class="basis-75 bg-gray-800 text-white sticky top-16 h-[calc(100vh-4rem)] p-4 overflow-y-auto shrink-0">
        <h2 class="italic text-lg mb-6 ml-6">
            BOOK DASHBOARD
        </h2>

        <ul>
         @for (route of routes; track $index) 
         {
            <app-buttons [Book_Buttons] = "route"></app-buttons>
         }
        </ul>
    </aside>
 }

    <main class="flex-1 p-8">

        <h1 class="text-3xl bg-gray-800 text-white italic text-center gap-2 rounded-md  p-3">
            Welcome To Athenaeum's Library Management System <br>
            Read Books To Gain Your Knowledge🧠
        </h1>

        <div class="bg-gray-800 p-6 rounded-md mt-3">
           <div>
                <router-outlet></router-outlet>
            </div>
        </div>
        
    </main>

</div>
