<div class="fixed top-0 w-full bg-slate-900 text-white flex justify-between items-center p-2 shadow-slate-900 shadow">

    <h1 class="text-2xl italic">
        ATHENAEUM's LIBRARY MANAGEMENT SYSTEM.,
    </h1>

    <img src="logo.avif" alt="Logo" class="w-12 h-12">
    
</div>


<div class="flex mt-16">

    <aside class="basis-64 bg-slate-900 text-white sticky top-16 h-[calc(100vh-4rem)] p-4 overflow-y-auto shrink-0">
        <h2 class="italic text-lg mb-6 ml-6">
            BOOK DASHBOARD
        </h2>

        <ul>
         @for (route of routes; track $index) 
         {
            <app-buttons [Book_Buttons] = "route"></app-buttons>
         }
        </ul>
    </aside>


    <main class="flex-1 p-8">

        <h1 class="text-3xl italic">
            Welcome To Athenaeum's Library...<br>
        </h1>

          <dl class="mt-4 p-2 italic text-xl">
              <dt>Founder Of This Website Is</dt>
              <dd class="mt-5 ml-8">- {{title}}</dd><br>
          </dl> 
            <router-outlet></router-outlet>
    </main>

</div>
