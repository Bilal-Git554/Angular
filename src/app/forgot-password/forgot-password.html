<div class="text-white text-center border border-white rounded-lg">

  <h1 class="text-2xl m-5">♻️ RESET PASSWORD</h1>

  <div>
    <label for="email">Enter Your Email :</label>
    <input type="email"  class="rounded-md w-90 border border-white p-3 mt-7 ml-7 mb-5 bg-gray-800 text-white">
  </div>

   <div>
       <button class="bg-green-500 p-3 rounded-md mb-7 mt-5 hover:scale-105" (click) = "reset_password()">SUBMIT</button>
       <button class="bg-red-500 p-3 rounded-md mb-7 mt-5 ml-5 hover:scale-105" (click) = "cancel()">CANCEL</button>
   </div>

</div>
