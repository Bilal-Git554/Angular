<div class="text-white">
    <div [formGroup] = "user">
        <label for="name">Enter Your Name :</label>
        <input type="text" [formControl] = "user.controls.name" class="border border-white ">
        @let name = user.controls.name;
        @if(name.errors && name.dirty)
        {
            @if(name.errors['required'])
            {
             <p class="text-red-500">This Field Is Required!</p>
            }
            
            @if(name.errors['minlength'])
            {
             <p class="text-red-500">Minimum Length Is 5!</p>
            }

            @if(name.errors['maxlength'])
            {
             <p class="text-red-500">Maximum Length Is 30 Only!</p>
            }

        }
        <br>

        <label for="age">Enter Your Age :</label>
        <input type="number" [formControl] = "user.controls.age" class="border border-white">

            <h1>Enter Your Address Deatils</h1>
            <label for="door_no">Door No :</label>
            <input type="text" [formControl] = "user.controls.address.controls.door_no" class="border border-white">

            <label for="street">Street :</label>
            <input type="text" [formControl] = "user.controls.address.controls.street_name" class="border border-white">

            <label for="area">Area :</label>
            <input type="text" [formControl] = "user.controls.address.controls.area" class="border border-white">

            <label for="city">City :</label>
            <input type="text" [formControl] = "user.controls.address.controls.city" class="border border-white">

            <label for="state">State :</label>
            <input type="text" [formControl] = "user.controls.address.controls.state" class="border border-white">

            <label for="country">Country :</label>
            <input type="text" [formControl] = "user.controls.address.controls.country" class="border border-white">
        <button (click) = "submit()" class="bg-green-500" [disabled]="!user.valid">Submit</button>
    </div>
</div>
