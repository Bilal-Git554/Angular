<div class="text-center text-white mb-4 border border-white rounded-lg">
    
    <div class="text-white font-bold text-2xl mt-5">
        <h1 class="mt-2">YOUR ATHENAEUM ACCOUNT</h1>
    </div>


  <div class="mt-10 font-bold">
    <span>EMAIL ADDRESS : </span>
    <span class="text-lg ml-2" [ngClass] = "Role === 'Admin' ? 'bg-amber-400/20  text-amber-300 rounded-md p-2' : 'bg-sky-400/20	text-sky-300 rounded-md p-2' ">{{Email}}</span>
  </div>


  <div class="mt-10 mr-30 font-bold">
    <span>ACCOUNT ROLE  : </span>
    <span class="text-lg ml-2" [ngClass] = "Role === 'Admin' ? 'bg-amber-400/20  text-amber-300 rounded-md p-2' : 'bg-sky-400/20	text-sky-300 rounded-md p-2' ">{{Role === 'Admin' ? '👑Admin' : '🔷User'}}</span>
  </div>

  <div class="mt-10 mr-30 font-bold">
    <span>ACCOUNT STATUS : </span>
    <span class="text-lg ml-2" [ngClass] = "Role === 'Admin' ? 'bg-green-400/20  text-green-300 rounded-md p-2' : 'bg-green-400/20	text-green-300 rounded-md p-2' ">● {{Status}}</span>
  </div>


    <button class="bg-blue-500 p-3 mt-10 mr-3 mb-5 text-white rounded-md hover:scale-105" (click)="back()">BACK</button>

</div>
